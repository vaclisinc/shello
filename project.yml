name: HerdrMobile
options:
  bundleIdPrefix: net.vaclis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  HerdrKit:
    path: Packages/HerdrKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    minorVersion: 1.20.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HerdrMobile:
    type: application
    platform: iOS
    sources:
      - HerdrMobile
    dependencies:
      - package: HerdrKit
      - package: SwiftTerm
      - target: ShelloWidgets
    info:
      path: HerdrMobile/Info.plist
      properties:
        CFBundleDisplayName: Shello
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Shello connects over SSH to computers on your local network.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: Shello uses background location only to keep your SSH sessions connected and agent notifications coming while the app is in the background. Your location is not stored or sent anywhere.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.vaclis.shello
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L5P5TK3DLY

  ShelloWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ShelloWidgets
      - HerdrMobile/Shared
    info:
      path: ShelloWidgets/Info.plist
      properties:
        CFBundleDisplayName: Shello
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.vaclis.shello.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L5P5TK3DLY
        SKIP_INSTALL: true

schemes:
  HerdrMobile:
    build:
      targets:
        HerdrMobile: all
    run:
      config: Debug
    archive:
      config: Release
