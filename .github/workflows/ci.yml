name: CI

on:
  push:
  pull_request:

jobs:
  herdrkit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test HerdrKit
        working-directory: Packages/HerdrKit
        run: swift test

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -quiet \
            -project HerdrMobile.xcodeproj \
            -scheme HerdrMobile \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -v -E "^(warning: |.*: warning: )" | grep -v "^$" | cut -c1-600 | head -400
